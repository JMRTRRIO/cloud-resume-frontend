<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay Reario | Cloud Resume</title>
    <script src="https://cdn.tailwindcss.com"></script> 
    <script src="js/main.js"></script>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">  <!-- Add Fallback HERE: Legacy ICO/PNG for old browsers or environments that don't support SVG icons -->
    <link href="/dist/output.css" rel="stylesheet">
</head>

<body class="bg-stone-50 text-stone-900  font-sans min-h-screen flex flex-col">

    <header id="header" class="sticky top-0 z-50 bg-stone-50 py-6 border-b border-stone-200">
        <div class="grow max-w-6xl mx-auto w-full px-6 flex justify-between items-center">
            
            <div class="flex items-center gap-4">
                <a href="/" class="block hover:opacity-80 transition-opacity">
                    <!-- Mobile Logo (Favicon) -->
                    <img src="assets/full-name.svg" alt="Jay Reario" class="h-15 w-auto md:hidden">
                    <!-- Desktop Logo (Full Name) -->
                    <img src="assets/full-name.svg" alt="Jay Reario" class="h-15 w-auto hidden md:block">
                </a>
            </div>

            <nav class="hidden md:flex gap-8 text-lg font-medium text-stone-600">
                <a href="resume" class="hover:text-amber-600 transition-colors">Resume</a>
                <a href="projects" class="hover:text-amber-600 transition-colors">Projects</a>
                <a href="contact" class="hover:text-amber-600 transition-colors">Contact</a>
            </nav>

            <div class="md:hidden">
                <button id="mobile-menu-btn" class="text-stone-600 hover:text-stone-900 focus:outline-none">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <nav id="mobile-menu" class="hidden md:hidden flex-col px-12 py-4 mt-6 space-y-4 bg-stone-600 rounded-lg mx-14">
            <a href="resume" class="block font-bold text-stone-50 hover:text-amber-600">Resume</a>
            <a href="projects" class="block font-bold text-stone-50 hover:text-amber-600">Projects</a>
            <a href="contact" class="block font-bold text-stone-50 hover:text-amber-600">Contact</a>
        </nav>
    
    </header>

    <main id="body" class="grow max-w-6xl mx-auto w-full px-6 py-14">
        
        <div class="mb-10 border-b border-stone-200 pb-4 text-center">
            <h2 class="text-5xl font-black text-stone-900 tracking-tighter">Get In Touch</h2>
            <p class="text-stone-500 text-lg mt-2">Have a question or want to work together? Leave a message below.</p>
        </div>

        <div class="bg-white border border-stone-200 rounded-2xl p-8 md:p-12 shadow-sm">
            
            <form id="contact-form" class="space-y-6">
                
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex-1">
                        <label for="name" class="block text-sm font-bold text-stone-700 mb-2 uppercase tracking-wide">Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required
                               class="w-full bg-stone-50 border border-stone-300 rounded-lg px-4 py-3 text-stone-800 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-transparent transition-all">
                    </div>
                    
                    <div class="flex-1">
                        <label for="email" class="block text-sm font-bold text-stone-700 mb-2 uppercase tracking-wide">Email</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required
                               class="w-full bg-stone-50 border border-stone-300 rounded-lg px-4 py-3 text-stone-800 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-transparent transition-all">
                    </div>
                </div>

                <div>
                    <label for="subject" class="block text-sm font-bold text-stone-700 mb-2 uppercase tracking-wide">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="Job Opportunity" required
                           class="w-full bg-stone-50 border border-stone-300 rounded-lg px-4 py-3 text-stone-800 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-transparent transition-all">
                </div>

                <div>
                    <label for="message" class="block text-sm font-bold text-stone-700 mb-2 uppercase tracking-wide">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Hello Jay, I would like to talk to you about..." required
                              class="w-full bg-stone-50 border border-stone-300 rounded-lg px-4 py-3 text-stone-800 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-transparent transition-all resize-none"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                            class="w-full md:w-auto bg-amber-600 text-white font-bold px-10 py-4 rounded-lg shadow-md transition-all duration-300 hover:bg-amber-700 hover:scale-[1.02] hover:shadow-lg flex items-center justify-center gap-2">
                        <span>Send Message</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                    </button>
                </div>

            </form>
        </div>

    </main>

    <footer id="footer" class="bg-stone-50 py-12 border-t border-stone-200">
        <div class="grow max-w-6xl mx-auto w-full px-14 flex flex-col md:flex-row justify-between items-center md:items-start gap-8 text-center md:text-left">
        
            <div class="flex flex-col">
                <h4 class="text-stone-400 text-xs font-bold uppercase tracking-[0.2em]">Connect</h4>
                <div class="mt-1 flex gap-4 text-stone-800">
                    
                    <!-- LinkedIn Icon -->
                    <a href="https://linkedin.com/in/j-reario" target="_blank" aria-label="LinkedIn" class="hover:text-amber-600 transition-colors">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                        </svg>
                    </a>
                    
                    <!-- GitHub Icon -->
                    <a href="https://github.com/JMRTRRIO" target="_blank" aria-label="GitHub" class="hover:text-amber-600 transition-colors">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                    </a>
                    
                </div>
            </div>

            <div class="flex flex-col">
                <h4 class="text-stone-400 text-xs font-bold uppercase tracking-[0.2em]">Email</h4>
                <p class="mt-1 font-semibold text-stone-800">
                    <a href="mailto:jaymartreario@gmail.com" class="hover:text-amber-600 transition-colors">jaymartreario@gmail.com</a>
                </p>
            </div>

            <div class="flex flex-col">
                <h4 class="text-stone-400 text-xs font-bold uppercase tracking-[0.2em]">Location</h4>
                <p class="mt-1 font-semibold text-stone-800">Bulacan, PH-03</p>
            </div>

            <div class="flex flex-col">
                <h4 class="text-stone-400 text-xs font-bold uppercase tracking-[0.2em]">Profile Views</h4>
                <p id="counter" class="mt-1 font-black text-amber-600">Loading...</p>
            </div>

        </div>

        <div class="w-full mt-4 pt-6 text-center">
            <p class="text-stone-500 text-sm">
                &copy; <span id="year"></span> Jay Reario. Built for the Cloud Resume Challenge.
            </p>
        </div>

    </footer>


</body>
</html>
